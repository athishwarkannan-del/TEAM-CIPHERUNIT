# =============================================================================
# MuleTrace AI — Alembic Configuration
# =============================================================================
# Database migration management for PostgreSQL.
#
# Commands:
#   alembic revision --autogenerate -m "description"   — Generate migration
#   alembic upgrade head                                — Apply all migrations
#   alembic downgrade -1                                — Rollback one migration
#   alembic history                                     — Show migration history
#   alembic current                                     — Show current revision
# =============================================================================

[alembic]
script_location = migrations
prepend_sys_path = .

# sqlalchemy.url is set programmatically in migrations/env.py
# from app.config.settings — NEVER hardcode credentials here.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
