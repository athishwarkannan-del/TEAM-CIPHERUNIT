# =============================================================================
# MuleTrace AI — Project Configuration
# =============================================================================
# Centralized configuration for Black, Ruff, isort, and pytest.
# All developers and CI/CD pipelines use this single source of truth.
# =============================================================================

[project]
name = "muletrace-ai-backend"
version = "1.0.0-alpha"
description = "Cross-Channel Mule Account Detection & Financial Crime Investigation Platform"
requires-python = ">=3.11"

# -----------------------------------------------------------------------------
# Black — Code Formatter
# -----------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311"]
skip-string-normalization = false

# -----------------------------------------------------------------------------
# Ruff — Linter
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "T20",  # flake8-print (catch stray print statements)
    "RET",  # flake8-return
    "PTH",  # flake8-use-pathlib
]
ignore = [
    "E501",  # line length handled by Black
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T20"]  # allow print in tests
"migrations/*" = ["E", "W", "F"]  # Alembic auto-generated code

# -----------------------------------------------------------------------------
# isort — Import Sorter
# -----------------------------------------------------------------------------
[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app"]
known_third_party = [
    "fastapi",
    "sqlalchemy",
    "pydantic",
    "neo4j",
    "uvicorn",
    "alembic",
]
sections = [
    "FUTURE",
    "STDLIB",
    "THIRDPARTY",
    "FIRSTPARTY",
    "LOCALFOLDER",
]

# -----------------------------------------------------------------------------
# pytest — Test Runner
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests (require database)",
    "e2e: End-to-end tests",
]
